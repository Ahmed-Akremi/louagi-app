# Supabase CLI config. Mirrors what `supabase init` would generate, with the
# auth flow tuned for phone-OTP sign-in. Run locally with `supabase start`,
# or link to the cloud project with `supabase link --project-ref <ref>` and
# push migrations via `supabase db push`.

project_id = "louagi-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["exp://localhost:8081"]
jwt_expiry = 900            # 15-min access tokens, per docs/backend-contract.md
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = false       # Phone is the primary identifier; email is optional.
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Louagi code is {{ .Code }}"

# Pick one SMS provider and fill credentials before running `supabase start`.
# The cloud project picks these up from the Supabase dashboard, not this file.
[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(TWILIO_AUTH_TOKEN)"

[edge_runtime]
enabled = true
inspector_port = 8083
